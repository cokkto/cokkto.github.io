<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Matikkatreeni</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="wrap">
      <!-- VIEW 1: SELECT -->
      <section id="viewStart" class="panel active" aria-label="Aloitus">
        <div class="title">Matikkatreeni</div>

        <div class="sub">Testien määrä</div>
        <div class="rowWrap" id="pickCount"></div>

        <div class="sub">Ajastin</div>
        <div class="rowWrap" id="pickTimer"></div>

        <div class="sub">Yhteenlasku</div>
        <div class="rowWrap" id="pickAdd"></div>

        <div class="sub">Vähennyslasku</div>
        <div class="rowWrap" id="pickSub"></div>

        <div class="sub">Peruslaskut</div>
        <div class="rowWrap" id="pickBasic"></div>

        <div class="sub">Kertolasku</div>
        <div class="rowWrap" id="pickMul"></div>

        <div class="sub">Jakolasku</div>
        <div class="rowWrap" id="pickDiv"></div>

        <button id="btnStart" class="startBtn">Aloita</button>

        <div class="hint">
          Valitse yksi tehtävätyyppi. Ajastin: 4 sek / tehtävä (esim. 50 → 200
          s).
        </div>
      </section>

      <!-- VIEW 2: TEST -->
      <section id="viewTrain" class="panel" aria-label="Harjoittelu">
        <div class="toprow">
          <div id="timer" class="timer">--:--</div>
          <div id="progress" class="progress">1 / 30</div>
        </div>

        <div id="task" class="task">__</div>

        <div class="answers" role="group" aria-label="Vastaukset">
          <button class="ansBtn" id="a0"></button>
          <button class="ansBtn" id="a1"></button>
          <button class="ansBtn" id="a2"></button>
          <button class="ansBtn" id="a3"></button>
        </div>

        <div class="smallRow">
          <button id="btnBack1" class="resetBtn">Takaisin</button>
        </div>
      </section>

      <!-- VIEW 3: SUMMARY -->
      <section id="viewDone" class="panel" aria-label="Tulos">
        <div class="title">Valmis</div>
        <div id="scoreTime" class="scoreSm">Aika: 00:00</div>
        <div id="scoreText" class="scoreBig">0 / 0</div>
        <div id="badge" class="badge">—</div>
        <div class="smallRow" style="margin-top: 14px">
          <button id="btnBack2" class="resetBtn">Takaisin</button>
        </div>
      </section>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
